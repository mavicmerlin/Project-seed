<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Station - Smart Cooking Companion</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #E85D04;
            --primary-dark: #DC2F02;
            --primary-light: #F48C06;
            --secondary: #2A9D8F;
            --accent: #FFB703;
            --bg-dark: #0A0A0A;
            --bg-medium: #1A1A1A;
            --bg-light: #2A2A2A;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --text-tertiary: #707070;
            --border: #333333;
            --success: #06D6A0;
            --warning: #FFB703;
            --error: #EF476F;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        #root {
            min-height: 100vh;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        /* Navigation */
        .nav {
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: fadeInUp 0.6s ease-out;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 0;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, rgba(232, 93, 4, 0.1), rgba(42, 157, 143, 0.1));
            border-radius: 24px;
            padding: 4rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(232, 93, 4, 0.2), transparent);
            animation: pulse 4s ease-in-out infinite;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* Device Control Panel */
        .device-panel {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .device-status {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-indicator.disconnected {
            background: var(--error);
            box-shadow: 0 0 10px var(--error);
        }

        .device-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .control-card {
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .control-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(232, 93, 4, 0.2);
        }

        .control-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .slider-container {
            position: relative;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-dark);
            outline: none;
            -webkit-appearance: none;
            position: relative;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(232, 93, 4, 0.4);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 12px rgba(232, 93, 4, 0.6);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(232, 93, 4, 0.4);
        }

        .slider-value {
            margin-top: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Buttons */
        .btn {
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(232, 93, 4, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(232, 93, 4, 0.5);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-medium);
            border-color: var(--primary);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #05B58C);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Recipe Grid */
        .section-header {
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .recipe-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .recipe-card {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .recipe-card:nth-child(1) { animation-delay: 0.1s; }
        .recipe-card:nth-child(2) { animation-delay: 0.2s; }
        .recipe-card:nth-child(3) { animation-delay: 0.3s; }
        .recipe-card:nth-child(4) { animation-delay: 0.4s; }
        .recipe-card:nth-child(5) { animation-delay: 0.5s; }
        .recipe-card:nth-child(6) { animation-delay: 0.6s; }

        .recipe-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 12px 32px rgba(232, 93, 4, 0.2);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            position: relative;
            overflow: hidden;
        }

        .recipe-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        .recipe-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .recipe-badge.premium {
            background: linear-gradient(135deg, var(--accent), var(--warning));
            color: var(--bg-dark);
        }

        .recipe-content {
            padding: 1.5rem;
        }

        .recipe-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .recipe-meta {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .recipe-meta-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .recipe-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .tag {
            padding: 0.3rem 0.8rem;
            background: var(--bg-light);
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .recipe-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .recipe-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stars {
            color: var(--accent);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeInUp 0.3s ease-out;
        }

        .modal {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideInRight 0.4s ease-out;
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: var(--primary);
        }

        .modal-body {
            padding: 2rem;
        }

        .recipe-detail-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
            border-radius: 16px;
            margin-bottom: 2rem;
        }

        .ingredients-list {
            list-style: none;
            margin-bottom: 2rem;
        }

        .ingredient-item {
            padding: 1rem;
            background: var(--bg-light);
            border-radius: 12px;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .steps-list {
            list-style: none;
        }

        .step-item {
            padding: 1.5rem;
            background: var(--bg-light);
            border-radius: 12px;
            margin-bottom: 1rem;
            position: relative;
            padding-left: 4rem;
        }

        .step-number {
            position: absolute;
            left: 1.5rem;
            top: 1.5rem;
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* Subscription Card */
        .subscription-banner {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-radius: 24px;
            padding: 3rem;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }

        .subscription-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
        }

        .subscription-content {
            position: relative;
            z-index: 1;
        }

        .subscription-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .plan-card {
            background: var(--bg-medium);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .plan-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .plan-card.featured {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(255, 183, 3, 0.1), transparent);
        }

        .plan-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .plan-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .plan-price {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary);
        }

        .plan-price span {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .plan-features {
            list-style: none;
            margin-bottom: 2rem;
        }

        .plan-features li {
            padding: 0.75rem 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .plan-features li:last-child {
            border-bottom: none;
        }

        .check-icon {
            color: var(--success);
        }

        /* Profile Page */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .profile-card {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            margin: 0 auto 1.5rem;
        }

        .profile-name {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .profile-email {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .preference-section {
            margin-bottom: 2rem;
        }

        .preference-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-dark);
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--primary);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* Meal Planner */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .day-card {
            background: var(--bg-medium);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            min-height: 150px;
        }

        .day-header {
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .meal-slot {
            background: var(--bg-light);
            border-radius: 8px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .meal-slot:hover {
            background: var(--primary);
        }

        .meal-slot.empty {
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-tertiary);
            text-align: center;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 4rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg-light);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin: 0 auto 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                gap: 1rem;
            }

            .hero {
                padding: 2rem;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .calendar-grid {
                grid-template-columns: 1fr;
            }

            .subscription-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Data
        const MOCK_RECIPES = [
            {
                id: 1,
                title: "Pad Thai Supreme",
                category: "Thai",
                time: 25,
                difficulty: "Medium",
                baseCalories: 520,
                rating: 4.8,
                reviews: 234,
                isPremium: false,
                image: "https://images.unsplash.com/photo-1559314809-0d155014e29e?w=800&q=80",

        // Device Control Component
        function DeviceControl({ isConnected, setIsConnected, selectedRecipe, user }) {
            const [flavorLevels, setFlavorLevels] = useState({
                sweet: 40
            });
            const [isDispensing, setIsDispensing] = useState(false);
            const [showConnectionModal, setShowConnectionModal] = useState(false);
            const [connectionType, setConnectionType] = useState('bluetooth');
            const [availableDevices, setAvailableDevices] = useState([]);
            const [isScanning, setIsScanning] = useState(false);
            const [selectedDevice, setSelectedDevice] = useState(null);
            const [savedPresets, setSavedPresets] = useState([
                { id: 1, name: 'Mild Sweet', levels: { sweet: 25 } },
                { id: 2, name: 'Extra Sweet', levels: { sweet: 85 } },
                { id: 3, name: 'Balanced', levels: { sweet: 50 } }
            ]);
            const [showPresetModal, setShowPresetModal] = useState(false);
            const [presetName, setPresetName] = useState('');
            const [showSetupGuide, setShowSetupGuide] = useState(false);

            // Calculate dynamic calories based on flavor adjustments
            const calculateCalories = () => {
                if (!selectedRecipe) return 0;
                
                let baseCalories = selectedRecipe.baseCalories;
                
                // Each flavor level represents grams of that ingredient added
                // Sweet (sugar): 4 calories per gram (only flavor module available)
                const sweetGrams = flavorLevels.sweet;
                const sweetCalories = sweetGrams * 4;
                
                const totalAddedCalories = sweetCalories;
                const adjustedCalories = baseCalories + totalAddedCalories;
                
                return Math.round(adjustedCalories);
            };

            // Get recommended amounts based on recipe type
            const getRecommendedLevels = () => {
                if (!selectedRecipe) return { sweet: 20 };
                
                // Different cuisines have different sweet flavor profiles
                if (selectedRecipe.category === 'Thai') {
                    return { sweet: 50 };
                } else if (selectedRecipe.category === 'Western') {
                    return { sweet: 10 };
                } else if (selectedRecipe.category === 'Japanese') {
                    return { sweet: 30 };
                } else if (selectedRecipe.category === 'Indian') {
                    return { sweet: 25 };
                } else if (selectedRecipe.category === 'Korean') {
                    return { sweet: 35 };
                } else if (selectedRecipe.category === 'Mexican') {
                    return { sweet: 20 };
                } else if (selectedRecipe.category === 'Healthy') {
                    return { sweet: 15 };
                }
                return { sweet: 25 };
            };

            const applyRecommended = () => {
                const recommended = getRecommendedLevels();
                setFlavorLevels(recommended);
            };

            const savePreset = () => {
                if (!presetName.trim()) {
                    alert('Please enter a preset name');
                    return;
                }
                const newPreset = {
                    id: Date.now(),
                    name: presetName,
                    levels: { ...flavorLevels }
                };
                setSavedPresets([...savedPresets, newPreset]);
                setPresetName('');
                setShowPresetModal(false);
                alert('Preset saved successfully!');
            };

            const loadPreset = (preset) => {
                setFlavorLevels(preset.levels);
            };

            const deletePreset = (presetId) => {
                setSavedPresets(savedPresets.filter(p => p.id !== presetId));
            };

            const confirmWifiIP = () => {
                if (!wifiIP.trim()) {
                    alert('Please enter an IP address');
                    return;
                }
                
                const wifiDevice = {
                    id: 'wifi-' + wifiIP,
                    name: `Flavor Station (${wifiIP})`,
                    signal: -40,
                    type: 'wifi',
                    ipAddress: wifiIP
                };
                setAvailableDevices([wifiDevice]);
                setShowWifiInput(false);

                                <div className="stat-label">Favorites</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">4.8</div>
                                <div className="stat-label">Avg Rating</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">
                                    {user.isPremium ? (
                                        <i className="fas fa-crown" style={{ color: 'var(--accent)' }}></i>
                                    ) : '—'}
                                </div>
                                <div className="stat-label">
                                    {user.isPremium ? 'Premium' : 'Free Plan'}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="profile-card">
                        <div className="preference-section">
                            <h3 className="preference-title">Dietary Preferences</h3>
                            <div className="toggle-group">
                                <div className="toggle-item">
                                    <span>Spicy Food</span>
                                    <label className="toggle-switch">
                                        <input 
                                            type="checkbox" 
                                            checked={preferences.spicyFood}
                                            onChange={() => togglePreference('spicyFood')}
                                        />
                                        <span className="toggle-slider"></span>
                                    </label>
                                </div>
                                <div className="toggle-item">
                                    <span>Vegetarian</span>
                                    <label className="toggle-switch">
                                        <input 
                                            type="checkbox" 
                                            checked={preferences.vegetarian}
                                            onChange={() => togglePreference('vegetarian')}
                                        />
                                        <span className="toggle-slider"></span>
                                    </label>
                                </div>
                                <div className="toggle-item">
                                    <span>Low Sodium</span>
                                    <label className="toggle-switch">
                                        <input 
                                            type="checkbox" 
                                            checked={preferences.lowSodium}
                                            onChange={() => togglePreference('lowSodium')}
                                        />
                                        <span className="toggle-slider"></span>
                                    </label>
                                </div>
                                <div className="toggle-item">
                                    <span>High Protein</span>
                                    <label className="toggle-switch">
                                        <input 
                                            type="checkbox" 
                                            checked={preferences.highProtein}
                                            onChange={() => togglePreference('highProtein')}
                                        />
                                        <span className="toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div className="preference-section">
                            <h3 className="preference-title">Recent Activity</h3>
                            <div style={{ color: 'var(--text-secondary)' }}>
                                <p style={{ marginBottom: '1rem' }}>
                                    <i className="fas fa-utensils" style={{ marginRight: '0.5rem' }}></i>
                                    Cooked Pad Thai Supreme - 2 hours ago
                                </p>
                                <p style={{ marginBottom: '1rem' }}>
                                    <i className="fas fa-heart" style={{ marginRight: '0.5rem', color: 'var(--error)' }}></i>
                                    Saved Teriyaki Salmon - Yesterday
                                </p>
                                <p>
                                    <i className="fas fa-calendar" style={{ marginRight: '0.5rem' }}></i>
                                    Planned meals for next week - 2 days ago
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Meal Planner Page
        function MealPlannerPage({ user }) {
            const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
            
            const [meals, setMeals] = useState({
                Monday: [
                    { id: 1, recipeId: 1, mealType: 'Lunch' },
                    { id: 2, recipeId: 3, mealType: 'Dinner' }
                ],
                Tuesday: [],
                Wednesday: [{ id: 3, recipeId: 5, mealType: 'Dinner' }],
                Thursday: [],
                Friday: [{ id: 4, recipeId: 2, mealType: 'Dinner' }],
                Saturday: [],
                Sunday: [
                    { id: 5, recipeId: 4, mealType: 'Lunch' },
                    { id: 6, recipeId: 6, mealType: 'Dinner' }
                ]
            });

            const [showAddMealModal, setShowAddMealModal] = useState(false);
            const [selectedDay, setSelectedDay] = useState(null);
            const [showShoppingList, setShowShoppingList] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);

            if (!user?.isPremium) {
                return (
                    <div style={{ textAlign: 'center', padding: '4rem' }}>
                        <i className="fas fa-lock" style={{ fontSize: '4rem', color: 'var(--accent)', marginBottom: '2rem' }}></i>
                        <h2 className="section-title">Premium Feature</h2>
                        <p className="section-subtitle" style={{ marginBottom: '2rem' }}>
                            Upgrade to Premium to access the Meal Planner
                        </p>
                        <button className="btn btn-primary">
                            <i className="fas fa-crown"></i>
                            Upgrade Now
                        </button>
                    </div>
                );
            }

            const getRecipeById = (id) => MOCK_RECIPES.find(r => r.id === id);

            const addMealToDay = (day, recipeId, mealType) => {
                const newMeal = {
                    id: Date.now(),
                    recipeId,
                    mealType
                };
                setMeals(prev => ({
                    ...prev,
                    [day]: [...prev[day], newMeal]
                }));
                setShowAddMealModal(false);
            };

            const removeMealFromDay = (day, mealId) => {
                setMeals(prev => ({
                    ...prev,
                    [day]: prev[day].filter(m => m.id !== mealId)
                }));
            };

            const autoGeneratePlan = () => {
                setIsGenerating(true);
                
                // Simulate AI generation
                setTimeout(() => {
                    const newPlan = {};
                    days.forEach((day, index) => {
                        const randomRecipes = [];
                        // Add 1-2 meals per day
                        const mealsCount = Math.random() > 0.3 ? 2 : 1;
                        for (let i = 0; i < mealsCount; i++) {
                            const randomRecipe = MOCK_RECIPES[Math.floor(Math.random() * MOCK_RECIPES.length)];
                            randomRecipes.push({
                                id: Date.now() + index + i,
                                recipeId: randomRecipe.id,
                                mealType: i === 0 ? 'Lunch' : 'Dinner'
                            });
                        }
                        newPlan[day] = randomRecipes;
                    });
                    setMeals(newPlan);
                    setIsGenerating(false);
                }, 2000);
            };

            const generateShoppingList = () => {
                const allIngredients = [];
                
                Object.values(meals).flat().forEach(meal => {
                    const recipe = getRecipeById(meal.recipeId);
                    if (recipe) {
                        recipe.ingredients.forEach(ing => {
                            const existing = allIngredients.find(i => i.name === ing.name);
                            if (existing) {
                                // Combine quantities (simplified - in real app would parse units)
                                existing.count++;
                                existing.recipes.push(recipe.title);
                            } else {
                                allIngredients.push({
                                    name: ing.name,
                                    amount: ing.amount,
                                    count: 1,
                                    recipes: [recipe.title]
                                });
                            }
                        });
                    }
                });

                return allIngredients;
            };

            const getTotalCalories = () => {
                return Object.values(meals).flat().reduce((total, meal) => {
                    const recipe = getRecipeById(meal.recipeId);
                    return total + (recipe?.baseCalories || 0);
                }, 0);
            };

            const getTotalMeals = () => {
                return Object.values(meals).flat().length;
            };

            return (
                <>
                    <div className="section-header">
                        <h2 className="section-title">Weekly Meal Planner</h2>
                        <p className="section-subtitle">Plan your meals for the week ahead</p>
                    </div>

                    <div style={{ 
                        display: 'grid', 
                        gridTemplateColumns: 'repeat(3, 1fr)', 
                        gap: '1rem',
                        marginBottom: '2rem',
                        padding: '1.5rem',
                        background: 'var(--bg-medium)',
                        borderRadius: '16px',
                        border: '1px solid var(--border)'
                    }}>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '2rem', fontWeight: '700', color: 'var(--primary)' }}>
                                {getTotalMeals()}
                            </div>
                            <div style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Meals Planned</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '2rem', fontWeight: '700', color: 'var(--secondary)' }}>
                                {getTotalCalories().toLocaleString()}
                            </div>
                            <div style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Total Calories</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                            <div style={{ fontSize: '2rem', fontWeight: '700', color: 'var(--accent)' }}>
                                {generateShoppingList().length}
                            </div>
                            <div style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Ingredients Needed</div>
                        </div>
                    </div>

                    <div style={{ marginBottom: '2rem', display: 'flex', gap: '1rem' }}>
                        <button 
                            className="btn btn-primary" 
                            onClick={autoGeneratePlan}
                            disabled={isGenerating}
                        >
                            {isGenerating ? (
                                <>
                                    <i className="fas fa-spinner fa-spin"></i>
                                    Generating...
                                </>
                            ) : (
                                <>
                                    <i className="fas fa-magic"></i>
                                    Auto-Generate Plan
                                </>
                            )}
                        </button>
                        <button 
                            className="btn btn-secondary"
                            onClick={() => setShowShoppingList(true)}
                        >
                            <i className="fas fa-shopping-cart"></i>
                            View Shopping List ({generateShoppingList().length})
                        </button>
                        <button 
                            className="btn btn-secondary"
                            onClick={() => setMeals(days.reduce((acc, day) => ({ ...acc, [day]: [] }), {}))}
                        >
                            <i className="fas fa-trash"></i>
                            Clear All
                        </button>
                    </div>

                    <div className="calendar-grid">
                        {days.map(day => (
                            <div key={day} className="day-card">
                                <div className="day-header">{day}</div>
                                {meals[day]?.map(meal => {
                                    const recipe = getRecipeById(meal.recipeId);
                                    return recipe ? (
                                        <div key={meal.id} className="meal-slot" style={{ position: 'relative', paddingRight: '2rem' }}>
                                            <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)', marginBottom: '0.25rem' }}>
                                                {meal.mealType}
                                            </div>
                                            <div style={{ fontWeight: '600', fontSize: '0.85rem' }}>
                                                {recipe.title}
                                            </div>
                                            <div style={{ fontSize: '0.75rem', color: 'var(--text-secondary)', marginTop: '0.25rem' }}>
                                                {recipe.baseCalories} kcal • {recipe.time} min
                                            </div>
                                            <button
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    removeMealFromDay(day, meal.id);
                                                }}
                                                style={{
                                                    position: 'absolute',
                                                    top: '0.5rem',
                                                    right: '0.5rem',
                                                    background: 'none',
                                                    border: 'none',
                                                    color: 'var(--error)',
                                                    cursor: 'pointer',
                                                    fontSize: '0.85rem'
                                                }}
                                            >
                                                <i className="fas fa-times"></i>
                                            </button>
                                        </div>
                                    ) : null;
                                })}
                                <div 
                                    className="meal-slot empty"
                                    onClick={() => {
                                        setSelectedDay(day);
                                        setShowAddMealModal(true);
                                    }}
                                >
                                    + Add meal
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Add Meal Modal */}
                    {showAddMealModal && (
                        <div className="modal-overlay" onClick={() => setShowAddMealModal(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Add Meal to {selectedDay}</h2>
                                    <button className="close-btn" onClick={() => setShowAddMealModal(false)}>
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <div style={{ marginBottom: '1.5rem' }}>
                                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600' }}>
                                            Meal Type
                                        </label>
                                        <select 
                                            id="mealType"
                                            style={{
                                                width: '100%',
                                                padding: '0.75rem',
                                                background: 'var(--bg-light)',
                                                border: '1px solid var(--border)',
                                                borderRadius: '8px',
                                                color: 'var(--text-primary)',
                                                fontSize: '1rem'
                                            }}
                                        >
                                            <option value="Breakfast">Breakfast</option>
                                            <option value="Lunch">Lunch</option>
                                            <option value="Dinner">Dinner</option>
                                            <option value="Snack">Snack</option>
                                        </select>
                                    </div>
                                    
                                    <div style={{ marginBottom: '1rem' }}>
                                        <label style={{ display: 'block', marginBottom: '0.5rem', fontWeight: '600' }}>
                                            Select Recipe
                                        </label>
                                    </div>

                                    <div style={{ 
                                        display: 'grid', 
                                        gridTemplateColumns: 'repeat(2, 1fr)', 
                                        gap: '1rem',
                                        maxHeight: '400px',
                                        overflowY: 'auto'
                                    }}>
                                        {MOCK_RECIPES.map(recipe => (
                                            <div
                                                key={recipe.id}
                                                onClick={() => {
                                                    const mealType = document.getElementById('mealType').value;
                                                    addMealToDay(selectedDay, recipe.id, mealType);
                                                }}
                                                style={{
                                                    padding: '1rem',
                                                    background: 'var(--bg-light)',
                                                    border: '1px solid var(--border)',
                                                    borderRadius: '12px',
                                                    cursor: 'pointer',
                                                    transition: 'all 0.3s ease'
                                                }}
                                                onMouseEnter={(e) => {
                                                    e.currentTarget.style.borderColor = 'var(--primary)';
                                                    e.currentTarget.style.transform = 'translateY(-2px)';
                                                }}
                                                onMouseLeave={(e) => {
                                                    e.currentTarget.style.borderColor = 'var(--border)';
                                                    e.currentTarget.style.transform = 'translateY(0)';
                                                }}
                                            >
                                                <div style={{
                                                    width: '100%',
                                                    height: '100px',
                                                    backgroundImage: `url(${recipe.image})`,
                                                    backgroundSize: 'cover',
                                                    backgroundPosition: 'center',
                                                    borderRadius: '8px',
                                                    marginBottom: '0.75rem'
                                                }}></div>
                                                <div style={{ fontWeight: '600', marginBottom: '0.5rem' }}>
                                                    {recipe.title}
                                                </div>
                                                <div style={{ fontSize: '0.85rem', color: 'var(--text-secondary)' }}>
                                                    {recipe.baseCalories} kcal • {recipe.time} min
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Shopping List Modal */}
                    {showShoppingList && (
                        <div className="modal-overlay" onClick={() => setShowShoppingList(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <div className="modal-header">
                                    <h2 className="modal-title">Shopping List</h2>
                                    <button className="close-btn" onClick={() => setShowShoppingList(false)}>
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="modal-body">
                                    <div style={{ marginBottom: '1.5rem', display: 'flex', gap: '1rem' }}>
                                        <button className="btn btn-primary" style={{ flex: 1 }}>
                                            <i className="fas fa-download"></i>
                                            Export List
                                        </button>
                                        <button className="btn btn-secondary" style={{ flex: 1 }}>
                                            <i className="fas fa-envelope"></i>
                                            Email to Me
                                        </button>
                                    </div>

                                    {generateShoppingList().length === 0 ? (
                                        <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-secondary)' }}>
                                            <i className="fas fa-shopping-basket" style={{ fontSize: '3rem', marginBottom: '1rem' }}></i>
                                            <p>No meals planned yet. Add some meals to generate a shopping list!</p>
                                        </div>
                                    ) : (
                                        <div>
                                            {generateShoppingList().map((ingredient, i) => (
                                                <div 
                                                    key={i}
                                                    style={{
                                                        padding: '1rem',
                                                        background: 'var(--bg-light)',
                                                        borderRadius: '12px',
                                                        marginBottom: '0.75rem',
                                                        display: 'flex',
                                                        justifyContent: 'space-between',
                                                        alignItems: 'center'
                                                    }}
                                                >
                                                    <div>
                                                        <div style={{ fontWeight: '600', marginBottom: '0.25rem' }}>
                                                            {ingredient.name}
                                                        </div>
                                                        <div style={{ fontSize: '0.85rem', color: 'var(--text-secondary)' }}>
                                                            {ingredient.amount} {ingredient.count > 1 && `× ${ingredient.count}`}
                                                        </div>
                                                        <div style={{ fontSize: '0.75rem', color: 'var(--text-tertiary)', marginTop: '0.25rem' }}>
                                                            For: {ingredient.recipes.join(', ')}
                                                        </div>
                                                    </div>
                                                    <input 
                                                        type="checkbox" 
                                                        style={{ width: '20px', height: '20px', cursor: 'pointer' }}
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // Main App Component
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [user, setUser] = useState({ 
                name: 'Sarah Chen', 
                email: 'sarah@example.com',
                isPremium: false 
            });
            const [showLogin, setShowLogin] = useState(false);
            const [isConnected, setIsConnected] = useState(false);

            return (
                <>
                    <Navigation 
                        currentPage={currentPage} 
                        setCurrentPage={setCurrentPage}
                        user={user}
                        setShowLogin={setShowLogin}
                    />
                    <div className="container">
                        {currentPage === 'home' && (
                            <HomePage 
                                user={user} 
                                setCurrentPage={setCurrentPage}
                                isConnected={isConnected}
                                setIsConnected={setIsConnected}
                            />
                        )}
                        {currentPage === 'recipes' && <RecipesPage user={user} />}
                        {currentPage === 'subscription' && (
                            <SubscriptionPage user={user} setUser={setUser} />
                        )}
                        {currentPage === 'profile' && <ProfilePage user={user} />}
                        {currentPage === 'planner' && <MealPlannerPage user={user} />}
                    </div>
                </>
            );
        }

        // Render App - React 18
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
